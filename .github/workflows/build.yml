name: Build adb

on:
  schedule:
    # Every day at 20:00 Japan Standard Time (UTC+9). GitHub cron uses UTC.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      aosp_ref:
        description: "AOSP tag or branch to build (empty = newest android-X.Y.Z_rN tag)"
        required: false
        default: ""
      force:
        description: "Build and publish even if this adb version is already released"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "cmake/**"
      - "patches/**"
      - ".github/workflows/build.yml"
  pull_request:

permissions:
  contents: write   # create releases
  actions: write    # keep the schedule from being auto-disabled

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check AOSP for a new adb
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.check.outputs.build }}
      tag: ${{ steps.check.outputs.tag }}
      commit: ${{ steps.check.outputs.commit }}
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - uses: actions/checkout@v5

      - name: Decide what to do
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          FORCE_INPUT: ${{ inputs.force }}
        run: |
          case "$EVENT" in
            schedule)          force=false;                 publish=true ;;
            workflow_dispatch) force=${FORCE_INPUT:-false}; publish=true ;;
            *)                 force=true;                  publish=false ;;  # push / PR: test build only
          esac
          echo "force=$force" >>"$GITHUB_OUTPUT"
          echo "publish=$publish" >>"$GITHUB_OUTPUT"

      - name: Look up the newest AOSP release tag
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ steps.mode.outputs.force }}
          AOSP_REF: ${{ inputs.aosp_ref }}
        run: bash scripts/check-update.sh "$AOSP_REF"

      # GitHub turns off scheduled workflows in repositories without activity
      # for 60 days. Re-enabling the workflow through the API resets that.
      - name: Keep the daily schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/build.yml/enable" || true

  build:
    name: Build ${{ needs.check.outputs.tag }} (${{ matrix.abi }})
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # arm64-v8a is what gets released. x86_64 is built from the same
        # sources only so it can be run in the emulator test below.
        abi: [arm64-v8a, x86_64]
    env:
      ANDROID_ABI: ${{ matrix.abi }}
      AOSP_REF: ${{ needs.check.outputs.tag }}
      WORK: ${{ github.workspace }}/work
      DIST: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: |
          missing=
          for t in ninja patch zip unzip; do command -v "$t" >/dev/null || missing="$missing $t"; done
          if [ -n "$missing" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ninja-build patch zip unzip
          fi
          cmake --version | head -n1
          ninja --version

      - name: Set up Android NDK
        run: bash scripts/setup-ndk.sh "$RUNNER_TEMP/ndk" >>"$GITHUB_ENV"

      - name: Fetch AOSP sources
        run: bash scripts/fetch-sources.sh "$AOSP_REF" "$WORK"

      - name: Restore third-party libraries
        id: deps
        uses: actions/cache/restore@v5
        with:
          path: |
            work/host
            work/prefix
            work/deps-src
          key: deps-${{ matrix.abi }}-${{ hashFiles('scripts/versions.env', 'scripts/build-deps.sh') }}

      - name: Build third-party libraries
        if: steps.deps.outputs.cache-hit != 'true'
        run: bash scripts/build-deps.sh "$WORK"

      # Saved right away, so a later failure doesn't throw the work away.
      - name: Save third-party libraries
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            work/host
            work/prefix
            work/deps-src
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Build adb
        run: bash scripts/build-adb.sh "$WORK" "$DIST"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: adb-${{ matrix.abi }}
          path: dist/
          if-no-files-found: error

  test:
    name: Self-debug test in an Android emulator
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v6
        with:
          name: adb-x86_64
          path: dist-x86_64

      - uses: actions/download-artifact@v6
        with:
          name: adb-arm64-v8a
          path: dist-arm64-v8a

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The x86_64 build must pass. The arm64 build is tried too, in case the
      # emulator image can run ARM binaries through its translation layer.
      - name: Run adb inside the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash scripts/smoke-test.sh dist-x86_64/adb
            SMOKE_OPTIONAL=1 bash scripts/smoke-test.sh dist-arm64-v8a/adb || echo "::notice::the x86_64 emulator could not run the arm64 binary; it was only tested as x86_64"

  release:
    name: Publish release
    needs: [check, build, test]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v6
        with:
          name: adb-arm64-v8a
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/publish-release.sh dist
